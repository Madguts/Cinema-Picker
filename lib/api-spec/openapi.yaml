openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Cinema Roulette
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cinema
    description: Cinema showtimes and movie data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /showtimes:
    get:
      operationId: getShowtimes
      tags: [cinema]
      summary: Get all movies and showtimes for a given date
      description: Scrapes Omniplex Lisburn for showtimes on the specified date
      parameters:
        - name: date
          in: query
          required: false
          description: "Date in YYYY-MM-DD format. Defaults to today."
          schema:
            type: string
      responses:
        "200":
          description: List of movies with showtimes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowtimesResponse"
        "500":
          description: Failed to fetch showtimes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /movie-details:
    get:
      operationId: getMovieDetails
      tags: [cinema]
      summary: Get detailed info for a movie
      description: Fetches movie details from the Omniplex movie page
      parameters:
        - name: url
          in: query
          required: true
          description: The full URL of the movie page on omniplexcinemas.co.uk
          schema:
            type: string
      responses:
        "200":
          description: Movie details including the synopsis and available metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetails"
        "400":
          description: Missing url parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to fetch movie details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Showtime:
      type: object
      properties:
        time:
          type: string
          description: "Show start time e.g. '14:30'"
        endTime:
          type: ["string", "null"]
          description: "End time e.g. '16:45'"
        bookingUrl:
          type: string
          description: Direct booking URL for this showtime
      required:
        - time
        - bookingUrl

    CinemaMovie:
      type: object
      properties:
        id:
          type: string
          description: Unique slug derived from the movie title/URL
        title:
          type: string
        posterUrl:
          type: ["string", "null"]
          description: Poster image URL
        detailUrl:
          type: string
          description: URL of the movie detail page on omniplexcinemas.co.uk
        durationMinutes:
          type: ["integer", "null"]
          description: Runtime in minutes
        certificate:
          type: ["string", "null"]
          description: Age rating e.g. 'PG', '12A', '15', '18'
        genres:
          type: array
          items:
            type: string
          description: List of genres e.g. ['Action', 'Adventure']
        synopsis:
          type: ["string", "null"]
          description: Full movie synopsis when available, otherwise the listings synopsis
        director:
          type: ["string", "null"]
          description: Movie director when available
        starring:
          type: ["string", "null"]
          description: Starring cast when available
        additionalInfo:
          type: array
          description: Other available movie metadata from the movie detail page
          items:
            type: object
            properties:
              label:
                type: string
              value:
                type: string
            required:
              - label
              - value
        trailerUrl:
          type: ["string", "null"]
          description: YouTube trailer URL extracted from the listings page
        showtimes:
          type: array
          items:
            $ref: "#/components/schemas/Showtime"
      required:
        - id
        - title
        - detailUrl
        - showtimes
        - genres

    ShowtimesResponse:
      type: object
      properties:
        date:
          type: string
          description: "The date these showtimes are for (YYYY-MM-DD)"
        movies:
          type: array
          items:
            $ref: "#/components/schemas/CinemaMovie"
      required:
        - date
        - movies

    MovieDetails:
      type: object
      properties:
        posterUrl:
          type: ["string", "null"]
          description: High-res poster image URL from the movie detail page
        synopsis:
          type: ["string", "null"]
          description: Full movie synopsis from the movie detail page when available
        director:
          type: ["string", "null"]
          description: Movie director when available
        starring:
          type: ["string", "null"]
          description: Starring cast when available
        additionalInfo:
          type: array
          description: Other available movie metadata from the movie detail page
          items:
            type: object
            properties:
              label:
                type: string
              value:
                type: string
            required:
              - label
              - value
      required: []
